# Folders with original FASTQ 
input_dir:
  PT: "PT"
  SE: "SE"

# Output folder
output_dir: "Teste"

# Number of threads
threads: 4


# Parameters of fastp
fastp:
  qualified_quality_phred: 20
  length_required: 100
  cut_front: false
  cut_tail: false
  detect_adapter_for_pe: true
  trim_poly_g: false
  trim_poly_x: true
  poly_x_min_len: 10
  low_complexity_filter: true
